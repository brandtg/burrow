name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      # Full history: goreleaser builds the changelog from the commit log
      # between tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pin the same goreleaser version as ci.yml and scripts/dev-tools.sh.
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.2
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
